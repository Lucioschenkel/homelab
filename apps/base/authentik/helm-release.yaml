apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: "2026.5.6"
      sourceRef:
        kind: HelmRepository
        name: goauthentik
      interval: 12h
  values:
    authentik:
      postgresql:
        host: file:///postgres-creds/host
        username: file:///postgres-creds/username
        password: file:///postgres-creds/password
      error_reporting:
        enabled: false
      # Required by the chart, but overwritten with an env var
      # Do NOT use the actual secret key.
      secret_key: "placeholder-not-used"

    global:
      env:
      - name: AUTHENTIK_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: authentik-secrets
            key: secret_key

    server:
      volumes:
        - name: postgres-creds
          secret:
            secretName: authentik-cluster-app
      volumeMounts:
        - name: postgres-creds
          mountPath: /postgres-creds
          readOnly: true
    worker:
      volumes:
        - name: postgres-creds
          secret:
            secretName: authentik-cluster-app
      volumeMounts:
        - name: postgres-creds
          mountPath: /postgres-creds
          readOnly: true
